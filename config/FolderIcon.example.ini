; Copy beside FolderIconCN.exe as FolderIcon.ini. Local copies must never be committed.
; Leave Target empty to use the actual Desktop, or set a folder path locally.
; Environment variables such as %USERPROFILE% are expanded.
; Use settings to manage the built-in login startup entry; background state is independent.
[General]
AutoStart=0
; Legacy compatibility; AutoStart takes precedence. Not a listener enable switch.
Resident=0
; Add the FolderIcon action to the current user's folder right-click menu.
ContextMenu=0
[Appearance]
FollowDesktop=1
; FontSize is points; TextGap is physical pixels. Desktop font follows monitor DPI.
FollowDesktopFont=1
FontSize=12
TextGap=3
; Preview early without shortening the Windows double-click recognition window.
; Recommended default: 80 ms. Zero remains an optional instant-preview setting.
ExpandDelay=80
; Dot-prefixed entries are hidden by default; ShowHidden also includes Windows hidden/system items.
DotNamesHidden=1
ShowHidden=0
IconSize=96
CellWidth=128
CellHeight=144
Columns=4
Opacity=88
Radius=20
Blur=1
Background=232830
